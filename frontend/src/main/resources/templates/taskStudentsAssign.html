<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/mock-views.css}" rel="stylesheet" />
    <title>Przypisz uzytkownika do zadania</title>
</head>
<body>
<div class="root">
    <header class="header">
        <p class="eyebrow">Zadanie</p>
        <h1 th:text="'Przypisz: ' + ${taskTitle}">Przypisz zadanie</h1>
        <nav class="nav">
            <a class="nav-chip" th:href="@{/projektList}">Projekty</a>
        </nav>
    </header>

    <section class="panel">
        <table>
            <thead>
            <tr><th>ID</th><th>Login</th><th>Email</th><th>Status</th><th>Akcja</th></tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.userId}">1</td>
                <td th:text="${student.username}">username</td>
                <td th:text="${student.email}">email</td>
                <td th:text="${assignedUserId != null and assignedUserId == student.userId ? 'przypisany' : '-'}">status</td>
                <td>
                    <form th:action="@{/taskStudentsAssign}" method="post">
                        <input type="hidden" name="taskId" th:value="${taskId}" />
                        <input type="hidden" name="userId" th:value="${student.userId}" />
                        <button class="btn secondary" type="submit">Przypisz</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="5">Brak uzytkownikow.</td></tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
